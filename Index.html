<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tanvir Hasan Anik | Portfolio</title>

  <meta name="description" content="Tanvir Hasan Anik - Personal Portfolio">
  <meta name="theme-color" content="#38bdf8">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050816;
      color: white;
      line-height: 1.6;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #123456 0%, #050816 55%);
    }

    .hero {
      max-width: 800px;
    }

    .profile {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #38bdf8;
      box-shadow: 0 0 30px #38bdf8;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    h1 span {
      color: #38bdf8;
    }

    .hero p {
      font-size: 19px;
      color: #cbd5e1;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      margin: 8px;
      background: #38bdf8;
      color: #050816;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #38bdf8;
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 35px;
      color: #38bdf8;
    }

    .about {
      text-align: center;
      color: #cbd5e1;
      font-size: 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0f172a;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #1e293b;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .card h3 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .card p {
      color: #cbd5e1;
    }

    .contact {
      text-align: center;
    }

    .contact p {
      color: #cbd5e1;
      margin: 10px 0;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #020617;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 34px;
      }

      .hero p {
        font-size: 16px;
      }

      .profile {
        width: 125px;
        height: 125px;
      }
    }
  </style>
</head>

    <div class="hero
