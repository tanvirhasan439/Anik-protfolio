<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanvir - Web Developer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        header {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 45px;
        }

        h1 span {
            color: #38bdf8;
        }

        .hero p {
            font-size: 20px;
            color: #cbd5e1;
            margin: 15px 0 25px;
        }

        .btn {
            background: #38bdf8;
            color: #0f172a;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        section {
            max-width: 900px;
            margin: auto;
            padding: 70px 20px;
            text-align: center;
        }

        h2 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .skill {
            background: #1e293b;
            padding: 15px 25px;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #020617;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <header>
        <div class="hero">
            <h1>Hi, I'm <span>Tanvir</span></h1>
            <p>I'm a Web Developer</p>
            <a href="#about" class="btn">About Me</a>
        </div>
    </header>

    <section id="about">
        <h2>About Me</h2>
        <p>
            Hello! I'm Tanvir.
            I'm learning Web Development and building websites
            using HTML, CSS and JavaScript.
        </p>
    </section>

    <section>
        <h2>My Skills</h2>

        <div class="skills">
            <div class="skill">HTML</div>
            <div class="skill">CSS</div>
            <div class="skill">JavaScript</div>
            <div class="skill">GitHub</div>
        </div>
    </section>

    <footer>
        © 2026 Tanvir | Web Developer
    </footer>

</body>
</html>
